services:
  familienakte:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familienakte
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: change-this-secret-key
    ports:
      - "8484:8484"
    volumes:
      - familienakte_data:/data
      - familienakte_backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familienakte-backup-scheduler
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: change-this-secret-key
    command: ["python", "backup_scheduler.py"]
    volumes:
      - familienakte_data:/data
      - familienakte_backups:/backups

volumes:
  familienakte_data:
    name: familienakte_data

  familienakte_backups:
    name: familienakte_backups

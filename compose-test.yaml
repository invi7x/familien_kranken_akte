services:
  stinkis-krankenakten-v081:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stinkis-krankenakten-v081
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: change-this-secret-key
    ports:
      - "8506:8484"
    volumes:
      - stinkis_v081_test_data:/data
      - stinkis_v081_test_backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stinkis-krankenakten-v081-backup-scheduler
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: change-this-secret-key
    command: ["python", "backup_scheduler.py"]
    volumes:
      - stinkis_v081_test_data:/data
      - stinkis_v081_test_backups:/backups


volumes:
  stinkis_v081_test_data:
    name: stinkis_v081_test_data

  stinkis_v081_test_backups:
    name: stinkis_v081_test_backups

services:
  familienakte-v084:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familienakte-v084
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt - bitte .env anlegen}
    ports:
      - "8510:8484"
    volumes:
      - familienakte_v084_test_data:/data
      - familienakte_v084_test_backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familienakte-v084-backup-scheduler
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt - bitte .env anlegen}
    command: ["python", "backup_scheduler.py"]
    volumes:
      - familienakte_v084_test_data:/data
      - familienakte_v084_test_backups:/backups

volumes:
  familienakte_v084_test_data:
    name: familienakte_v084_test_data

  familienakte_v084_test_backups:
    name: familienakte_v084_test_backups
